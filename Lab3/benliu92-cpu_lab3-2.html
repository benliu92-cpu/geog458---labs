
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3: Seattle Elevation Map</title>

  <link rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">

  <style>
    body {
      margin: 0;
      font: 14px/1.5 Arial, sans-serif;
      color: #182e3a;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 16px;
      width: 260px;
      max-width: calc(100% - 100px);
      background: white;
      max-height: calc(100% - 80px);
      overflow: auto;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    p {
      margin: 8px 0;
    }

    .ramp {
      height: 14px;
      background: linear-gradient(to right,
        #D9EBC5, #98C79A, #F5E6A5, #D7A875, #916B50);
    }

    .values {
      display: flex;
      justify-content: space-between;
    }

    .maplibregl-popup-content {
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <section id="panel">
    <h1>Seattle Elevation Map</h1>

    <p>USGS 3DEP Digital Elevation Model</p>

    <p id="status">Loading elevation map...</p>

    <div id="surface-control">
      <label>
        <input id="show-surface" type="checkbox" checked>
        Show elevation
      </label>
    </div>

    <div id="legend">
      <p><strong>Elevation (meters)</strong></p>

      <div class="ramp"></div>

      <div class="values">
        <span>-16</span>
        <span>150</span>
        <span>1348</span>
      </div>

      <p>
        Elevation estimates from USGS 3DEP.
        Colors represent terrain elevation.
      </p>
    </div>

  </section>

  <script type="module">

    import * as maplibregl from
      'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
      container: 'map',

      style: {
        version: 8,
        sources: {},
        layers: [{
          id: 'background',
          type: 'background',
          paint: {
            'background-color': '#edf1f0'
          }
        }]
      },

      center: [-122.3321, 47.6062],
      zoom: 10,
      minZoom: 8,
      maxZoom: 12,

      maxBounds: [
        [-122.75, 47.10],
        [-122.05, 48.15]
      ]
    });

    map.addControl(new maplibregl.NavigationControl());

    map.addControl(new maplibregl.ScaleControl({
      unit: 'metric'
    }));

    map.on('error', (event) => {
      document.getElementById('status').textContent =
        'Load error: check tile paths and browser Console.';

      console.error(event.error);
    });

    map.on('load', () => {

      // Step 1: Independent Mapbox basemap

      map.addSource('basemap-tiles', {
        type: 'raster',

        tiles: [
          'assets/mapbox-independentguided/{z}/{x}/{y}.png'
        ],

        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,

        bounds: [-122.75, 47.10, -122.05, 48.15],

        attribution:
          '© Mapbox © OpenStreetMap'
      });

      map.addLayer({
        id: 'basemap',
        type: 'raster',
        source: 'basemap-tiles',

        paint: {
          'raster-opacity': 1,
          'raster-fade-duration': 0
        }
      });


      // Step 2: USGS elevation raster

      map.addSource('elevation-tiles', {
        type: 'raster',

        tiles: [
          'assets/elevation/{z}/{x}/{y}.png'
        ],

        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,

        bounds: [-122.75, 47.10, -122.05, 48.15],

        attribution:
          'Elevation: USGS 3DEP; map by Ben Liu'
      });

      map.addLayer({
        id: 'elevation-surface',
        type: 'raster',
        source: 'elevation-tiles',

        paint: {
          'raster-opacity': 0.7,
          'raster-fade-duration': 0
        }
      });


      // Step 3: Elevation visibility control

      document.getElementById('show-surface')
        .addEventListener('change', (event) => {

          map.setLayoutProperty(
            'elevation-surface',
            'visibility',
            event.target.checked ? 'visible' : 'none'
          );

          document.getElementById('legend').hidden =
            !event.target.checked;
        });


      document.getElementById('status').textContent =
        'Toggle elevation to compare terrain with the basemap.';

    });

  </script>

</body>
</html>
