<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmVubGl1OTIiLCJhIjoiY211d3ptZzA1MDJoMDM0b2xvdDQwb2plZyJ9.7vN74C3GF6W7YOVJLNmNlw';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 11,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    // This callback runs after the map style is ready. Keep its braces.
    map.on('load', () => {
      // [1.3] REPLACE THIS LINE WITH THE TREE SOURCE BLOCK.
      map.setFog({});
      map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson'
      });
      // [1.4] REPLACE THIS LINE WITH THE TREE HEATMAP BLOCK.
      map.addLayer({
        'id': "trees-heat",
        'type': "heatmap",
        'source': "trees",
        'maxzoom': 15,
        'paint': {
          'heatmap-weight': {
            'property': "dbh",
            'type': "exponential",
            'stops': [[1, 0], [62, 1]]
          },
          'heatmap-intensity': 1.6,
          'heatmap-color': [
            "interpolate", ["linear"], ["heatmap-density"],
            0, 'rgba(18,63,133,0)',
            0.2, 'rgb(43,131,186)',
            0.4, 'rgb(128,205,193)',
            0.6, 'rgb(254,224,139)',
            0.8, 'rgb(244,109,67)',
            1, 'rgb(215, 48, 39)'
          ],
          'heatmap-radius': 10,
          'heatmap-opacity': {
            'default': 1,
            'stops': [[14, 1], [15, 0]]
          }
        }
      });
      // [1.5] REPLACE THIS LINE WITH THE TREE CIRCLE BLOCK.
      map.addLayer({
        'id': "trees-point",
        'type': "circle",
        'source': "trees",
        'minzoom': 14,
        'paint': {
          'circle-radius': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [{ 'zoom': 15, 'value': 1 }, 5],
              [{ 'zoom': 15, 'value': 62 }, 10],
              [{ 'zoom': 22, 'value': 1 }, 20],
              [{ 'zoom': 22, 'value': 62 }, 50]
            ]
          },
          'circle-color': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [0, "rgba(236,222,239,0)"],
              [10, "rgb(236,222,239)"],
              [20, "rgb(208,209,230)"],
              [30, "rgb(166,189,219)"],
              [40, "rgb(103,169,207)"],
              [50, "rgb(28,144,153)"],
              [60, "rgb(1,108,89)"]
            ]
          },
          'circle-stroke-color': "white",
          'circle-stroke-width': 1,
          'circle-opacity': {
            'stops': [[14, 0], [15, 1]]
          }
        }
      });
      // [1.6] REPLACE THIS LINE WITH THE TREE POPUP BLOCK.
      map.on('click', 'trees-point', (event) => {
        new mapboxgl.Popup()
          .setLngLat(event.features[0].geometry.coordinates)
          .setHTML(`<strong>DBH:</strong> ${event.features[0].properties.dbh}`)
          .addTo(map);
      });

    });
  </script>
</body>
</html>
