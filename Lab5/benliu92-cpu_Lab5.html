<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 5 — New York Harbor Vessel Traffic, Flow Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
  <style>
    body { margin: 0; font: 14px Arial, sans-serif; background: #101924; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 16px; left: 16px; max-width: calc(100vw - 64px);
      padding: 16px; background: #172333; color: white; border-radius: 8px; }
    h1 { margin: 0 0 12px; font-size: 19px; }
    p { color: #c0cfdd; font-size: 12px; }
    label { display: block; margin: 12px 0 6px; }
    select, button { padding: 8px; border: 1px solid #637487; border-radius: 4px;
      background: #26394f; color: white; font: inherit; }
    button { cursor: pointer; margin-left: 6px; }
    #time-slider {display: block; width: 100%; margin: 10px 0; cursor: pointer; }
    #time-display { color: #e8f0fb; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>New York Harbor Vessel Traffic, Flow Map</h1>
    <p id="status" role="status">Loading AIS paths...</p>
    <!-- STEP 2A: Add the vessel-type dropdown here. -->
     <label for="vessel-type">Vessel type</label>
    <select id="vessel-type">
      <option value="passenger" selected>Passenger</option>
      <option value="tanker">Tanker</option>
      <option value="cargo">Cargo</option>
      <option value="other">Other vessels</option>
    </select>
    <!-- STEP 3A: Add the Play/Stop button here. -->
     <button id="play-stop" type="button" aria-pressed="true">Stop</button>
     <label for="time-slider">New York Local Date/Time</label>
     <p id="time-display"></p>
     <input id="time-slider" type="range" min="0" max="1" value="0" step="1">
  </div>
  <script>
    // STEP 1: Create the map and load the preprocessed JSON.
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmVubGl1OTIiLCJhIjoiY211d3ptZzA1MDJoMDM0b2xvdDQwb2plZyJ9.7vN74C3GF6W7YOVJLNmNlw';
    const map = new mapboxgl.Map({
      container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
      center: [-74.08, 40.65], zoom: 9, pitch: 35
    });
    const overlay = new deck.MapboxOverlay({layers: []});
    map.addControl(overlay);

    async function main() {
      const status = document.getElementById('status');
      const response = await fetch('./ais_trips.json');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const trips = data.filter(d => d.path.length >= 2);
      if (!trips.length) throw new Error('No vessel paths found.');
      let displayedTrips = trips;
      let playing = true;
      const startTime = Math.min(...trips.map(d => d.timestamps[0]));
      const endTime = Math.max(...trips.map(d => d.timestamps.at(-1))) + 3600;
      let currentTime = Math.min(startTime + 3600, endTime);
      let previousFrame = null;
      const actualStartTime = new Date('2025-12-24T00:00:00-05:00');

      const timeSlider = document.getElementById('time-slider');
      const timeDisplay = document.getElementById('time-display');

      timeSlider.min = startTime;
      timeSlider.max = endTime;
      timeSlider.value = currentTime;

      const nyFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZoneName: 'short'
      });
      status.textContent = `${trips.length} paths loaded`;

      function draw() {
        overlay.setProps({layers: [new deck.TripsLayer({
          id: 'ais-trips', data: displayedTrips,
          getPath: d => d.path,
          getTimestamps: d => d.timestamps,
          getColor: [253, 128, 93],
          widthMinPixels: 3,
          currentTime: currentTime,
          trailLength: 3600
        })]});
        const elapsedSeconds = currentTime - startTime;
        const displayDate = new Date(actualStartTime.getTime() + elapsedSeconds * 1000);
        timeDisplay.textContent = nyFormatter.format(displayDate);
      }

      // STEP 2B: Add the filter logic here, inside main().
      const vesselType = document.getElementById('vessel-type');

      function applyFilter() {
        displayedTrips = trips.filter(d => {
          const type = Number(d.type);
          if (vesselType.value === 'passenger') return type >= 60 && type < 70;
          if (vesselType.value === 'tanker') return type >= 80 && type < 90;
          if (vesselType.value === 'cargo') return type >= 70 && type < 80;
          return !(type >= 60 && type < 90);
        });
        status.textContent = `${displayedTrips.length} paths selected`;
        draw();
      }

      vesselType.addEventListener('change', applyFilter);
      applyFilter(); // Apply the default Passenger selection immediately.
      // STEP 3B: Add the Play/Stop listener here, inside main().
      const playStop = document.getElementById('play-stop');

      playStop.addEventListener('click', () => {
        playing = !playing;
        playStop.textContent = playing ? 'Stop' : 'Play';
        playStop.setAttribute('aria-pressed', String(playing));
      });
      timeSlider.addEventListener('input', () => {
        playing = false;
        playStop.textContent = 'Play';
        playStop.setAttribute('aria-pressed', 'false');

        currentTime = Number(timeSlider.value);
        draw();
      });

      // Advance data time by 15 minutes per real second.
      function animate(now) {
        const elapsed = previousFrame === null ? 0 : Math.min((now - previousFrame) / 1000, 0.2);
        previousFrame = now;
        if (playing) {
          currentTime += elapsed * 900;
          if (currentTime > endTime) {
            currentTime = startTime;
          }
        

          draw();
        }
        requestAnimationFrame(animate);
      }
      draw();
      requestAnimationFrame(animate);
    }

    main().catch(error => {
      document.getElementById('status').textContent = `Error: ${error.message}. Check your file path and local server.`;
      console.error(error);
    });
  </script>
</body>
</html>
